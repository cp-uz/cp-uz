# Inside the cp.uz TLS server block. Keep the prefix out of the main SPA.
location = /grader15150 { return 301 /grader15150/; }
location ^~ /grader15150/ {
    proxy_pass http://127.0.0.1:8150/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /grader15150;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
