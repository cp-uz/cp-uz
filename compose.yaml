name: cpuz

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cpuz_internal

  web:
    image: cpuz-web:${CPUZ_RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file:
      - ${CPUZ_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/db.sqlite3}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sqlite_data:/app/data
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./content:/app/content:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': 'cp.uz'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - cpuz_internal

  frontend:
    image: cpuz-frontend:${CPUZ_RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_URL: /api/v1
        HTTP_PROXY: ${NPM_PROXY_URL:-}
        HTTPS_PROXY: ${NPM_PROXY_URL:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${CPUZ_BIND_ADDRESS:-127.0.0.1}:${CPUZ_HTTP_PORT:-18181}:80"
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cpuz_internal

volumes:
  sqlite_data:
  static_data:
  media_data:

networks:
  cpuz_internal:
    driver: bridge
