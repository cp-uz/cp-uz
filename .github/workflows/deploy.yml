name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Deploy qilinadigan 40 belgili Git commit SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact revision
    permissions:
      actions: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CPUZ_DEPLOY_HOST: ${{ secrets.CPUZ_DEPLOY_HOST }}
      CPUZ_DEPLOY_USER: ${{ secrets.CPUZ_DEPLOY_USER }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
    steps:
      - name: Require successful CI for the exact manual revision
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Deploy SHA must contain exactly 40 lowercase hexadecimal characters." >&2
            exit 2
          }
          conclusion=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$DEPLOY_SHA" -f branch=main -f event=push \
            --jq '.workflow_runs[0].conclusion // "missing"')
          test "$conclusion" = success || {
            echo "The requested main revision must have successful CI before deployment." >&2
            exit 1
          }
      - name: Configure restricted SSH identity
        env:
          CPUZ_DEPLOY_KEY: ${{ secrets.CPUZ_DEPLOY_KEY }}
          CPUZ_KNOWN_HOSTS: ${{ secrets.CPUZ_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$CPUZ_DEPLOY_HOST"
          test -n "$CPUZ_DEPLOY_USER"
          test -n "$CPUZ_DEPLOY_KEY"
          test -n "$CPUZ_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$CPUZ_DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/cpuz_deploy"
          printf '%s\n' "$CPUZ_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/cpuz_deploy" "$HOME/.ssh/known_hosts"
      - name: Deploy exact tested commit
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Deploy SHA must contain exactly 40 lowercase hexadecimal characters." >&2
            exit 2
          }
          ssh \
            -i "$HOME/.ssh/cpuz_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$CPUZ_DEPLOY_USER@$CPUZ_DEPLOY_HOST" \
            "deploy $DEPLOY_SHA"
