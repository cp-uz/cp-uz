    <script>
      (() => {
        const visitKey = 'cpuz:fact-loader-shown';
        let loaderExperience = 'simple';
        try {
          if (localStorage.getItem(visitKey)) loaderExperience = 'fact';
          else localStorage.setItem(visitKey, '1');
        } catch {
          // When storage is unavailable, prioritize a fast first render.
        }
        document.documentElement.dataset.loaderExperience = loaderExperience;

        try {
          const settings = JSON.parse(localStorage.getItem('app-settings') || 'null');
          const fonts = [
            'Public Sans Variable',
            'Inter Variable',
            'IBM Plex Sans Variable',
            'Source Sans 3 Variable',
          ];
          if (settings && fonts.includes(settings.fontFamily)) {
            document.documentElement.style.setProperty(
              '--boot-font-family',
              `"${settings.fontFamily}", Arial, sans-serif`
            );
          }
          if (settings && Number.isFinite(settings.fontSize)) {
            document.documentElement.style.setProperty(
              '--boot-font-size',
              `${Math.min(20, Math.max(14, settings.fontSize))}px`
            );
          }
        } catch {
          // The default boot typography remains active when stored settings are malformed.
        }
      })();
    </script>

    <script>
      (() => {
        if (document.documentElement.dataset.loaderExperience !== 'fact') return;
        const facts = Array.isArray(window.__cpuzLoadingFacts)
          ? window.__cpuzLoadingFacts
          : ['Algoritm murakkabligini kirish hajmiga bog‘lab tahlil qiling.'];
        const storageKey = 'cpuz:loader-last-fact';
        const factElement = document.getElementById('boot-fact');
        let previous = -1;
        try {
          const stored = Number(localStorage.getItem(storageKey));
          if (Number.isInteger(stored) && stored >= 0 && stored < facts.length) previous = stored;
        } catch {
          // Storage is optional for the boot experience.
        }
        const nextIndex = () => {
          const index =
            previous < 0
              ? Math.floor(Math.random() * facts.length)
              : (previous + 1 + Math.floor(Math.random() * (facts.length - 1))) % facts.length;
          previous = index;
          document.documentElement.dataset.loaderFactIndex = String(index);
          try {
            localStorage.setItem(storageKey, String(index));
          } catch {
            /* noop */
          }
          if (factElement) factElement.textContent = facts[index];
        };
        nextIndex();
        window.__cpuzBootFactTimer = window.setInterval(nextIndex, 1800);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
