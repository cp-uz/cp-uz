[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001", "DJ012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core", "common", "content_tools", "scripts", "deploy"]

[tool.coverage.run]
source = ["apps", "core", "common", "content_tools"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
