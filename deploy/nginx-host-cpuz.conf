# Installed as the canonical cp.uz server block in the host Nginx configuration.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cp.uz www.cp.uz;
    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/cp.uz-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cp.uz-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.cp.uz) {
        return 301 https://cp.uz$request_uri;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:18181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
